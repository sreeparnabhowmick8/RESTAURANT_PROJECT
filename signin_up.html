<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In Form</title>

    <!-- GOOGLE FONT -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
            url("restaurantbg.jpg");

            background-size:cover;
            background-position:center;
        }

        /* LOGIN CARD */

        .login-container{

            width:100%;
            max-width:420px;

            background:rgba(255,255,255,0.15);

            backdrop-filter:blur(10px);

            padding:40px;

            border-radius:25px;

            box-shadow:0 8px 20px rgba(0,0,0,0.3);

            color:white;
        }

        .login-container h2{

            text-align:center;

            margin-bottom:30px;

            font-size:32px;
        }

        /* INPUT GROUP */

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{

            display:block;

            margin-bottom:8px;

            font-weight:500;
        }

        .input-group input{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            outline:none;

            font-size:15px;
        }

        .input-group input:focus{

            box-shadow:0 0 8px rgba(255,255,255,0.6);
        }

        /* BUTTONS */

        .button-group{

            display:flex;

            gap:15px;

            margin-top:10px;
        }

        .btn{

            flex:1;

            padding:14px;

            border:none;

            border-radius:12px;

            cursor:pointer;

            font-size:16px;

            font-weight:bold;

            transition:0.3s;
        }

        .submit-btn{

            background:linear-gradient(to right,#ff145e,#ff7a18);

            color:white;
        }

        .reset-btn{

            background:white;

            color:#ff145e;
        }

        .btn:hover{

            transform:scale(1.03);

            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        /* FORGOT PASSWORD */

        .forgot{

            text-align:center;

            margin-top:20px;
        }

        .forgot a{

            color:white;

            text-decoration:none;

            font-size:14px;
        }

        .forgot a:hover{

            text-decoration:underline;
        }

        /* DIVIDER */

        .divider{

            text-align:center;

            margin:25px 0;

            position:relative;
        }

        .divider::before,
        .divider::after{

            content:"";

            position:absolute;

            top:50%;

            width:40%;

            height:1px;

            background:white;
        }

        .divider::before{
            left:0;
        }

        .divider::after{
            right:0;
        }

        /* GOOGLE BUTTON */

        .google-btn{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            background:white;

            color:#333;

            font-size:15px;

            font-weight:600;

            display:flex;

            justify-content:center;

            align-items:center;

            gap:10px;

            cursor:pointer;

            transition:0.3s;
        }

        .google-btn img{
            width:22px;
            height:22px;
        }

        .google-btn:hover{

            transform:scale(1.02);

            background:#f5f5f5;
        }

        /* SUCCESS MESSAGE */

        .success-message{

            display:none;

            margin-top:20px;

            text-align:center;

            color:#90ee90;

            font-weight:bold;
        }

        /* RESPONSIVE */

        @media(max-width:500px){

            .login-container{

                margin:20px;

                padding:30px 25px;
            }

            .login-container h2{
                font-size:28px;
            }
        }

    </style>

</head>

<body>

    <!-- LOGIN BOX -->

    <div class="login-container">

        <h2>Sign In</h2>

        <!-- FORM -->

        <form onsubmit="showMessage(event)">

            <!-- NAME -->

            <div class="input-group">

                <label>Name</label>

                <input
                type="text"
                placeholder="Enter your name"
                required>

            </div>

            <!-- EMAIL -->

            <div class="input-group">

                <label>Email Address</label>

                <input
                type="email"
                placeholder="Enter your email"
                required>

            </div>

            <!-- PASSWORD -->

            <div class="input-group">

                <label>Password</label>

                <input
                type="password"
                placeholder="Enter your password"
                required>

            </div>

            <!-- BUTTONS -->

            <div class="button-group">

                <button type="submit" class="btn submit-btn">
                    Submit
                </button>

                <button type="reset" class="btn reset-btn">
                    Reset
                </button>

            </div>

        </form>

        <!-- SUCCESS MESSAGE -->

        <div id="successMessage" class="success-message">

            ✅ Login Successful!

        </div>

        <!-- FORGOT PASSWORD -->

        <div class="forgot">

            <a href="password copy.html">
                Forgot your Password?
            </a>

        </div>

        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>

        <!-- GOOGLE LOGIN -->

        <button class="google-btn">

            <img
            src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png"
            alt="Google">

            Sign in with Google

        </button>

    </div>

    <!-- JAVASCRIPT -->

    <script>

        function showMessage(event){

            event.preventDefault();

            document.getElementById("successMessage").style.display = "block";
        }

    </script>

</body>

</html>
